- title: Experience
  type: time_table
  contents:
    - title: Research Team Lead
      institution: Big Mathematical Workshop (BMM), Novosibirsk State University
      year: July 2026 – Present
      location: Novosibirsk, Russia
      description:
        - 'Working on AlignSSL-SV, a neural network system for detecting genomic mutations, especially deletions, from sequencing read alignments. Deletions are losses of DNA segments in the genome.'
        - 'Compared an image-free alignment-tensor representation with a DeepSV-style RGB-pileup baseline; the project uses multi-scale CNNs, a transformer encoder, and a calibrated deletion classifier.'
        - 'Ran experiments with masked alignment modeling, varying amounts of labeled data, cross-population evaluation, and hard-negative controls on 1000 Genomes data.'
        - 'Led the research team and maintained a reproducible Python pipeline for data extraction, self-supervised pretraining, fine-tuning, model evaluation, result analysis, and preprint preparation.'
        - 'The study is ongoing; a preprint is in preparation.'
    - title: AI Research Intern
      institution: AIRI Institute of Artificial Intelligence (TSU x AIRI)
      year: March 2026 – May 2026
      description:
        - 'Investigated the data bottleneck for chemical LLMs. Existing datasets, including ChemCoTBench, have positive-label bias, require costly manual annotation, and lack explanations for failed reactions.'
        - 'Developed Auto-ChemInstruct, an autonomous four-stage multi-agent pipeline for generation, verification, reflection, and compilation. The pipeline creates large, physically verified datasets for RLHF/DPO without human annotators.'
        - 'Reduced positive-label bias by using RDKit and xTB to turn failed reactions into causal chain-of-thought failure traces and negative training examples.'
        - 'Orchestrated the pipeline through Maestro with a research-team topology of a GI agent, analyst, and literature reviewer. Used GigaChain for multimodal RAG with PubChem and Materials Project, plus GigaEvo for MAP-Elites prompt optimization through LangGraph.'
        - 'Co-authored a paper on scalable agent-based synthetic data generation for chemistry. Manuscript in preparation for NeurIPS Datasets & Benchmarks.'
    - title: Independent Machine Learning Researcher
      institution: Wunder Fund RNN
      year: September 2025 – January 2026
      description:
        - 'Designed and deployed an inference pipeline for high-frequency trading market-state forecasting. Placed in the Top 30 of the Wunder Fund Challenge global ranking.'
        - 'Developed a custom dynamic INT8 quantization pipeline in PyTorch for deployment on a single CPU core with a memory limit under 20 MB.'
        - 'Reduced memory usage by 75%, allowing a 10-model ensemble to run within the resource budget.'
        - 'Designed a Hive Mind ensemble of deep residual GRUs and LSTMs with Mish activations and Squeeze-and-Excitation blocks.'
        - 'Set up MLOps practices including automated artifact serialization, custom Huber and Pinball losses, and cross-validation to control overfitting on small financial datasets.'
    - title: Mathematics Problem Creator and Programmer
