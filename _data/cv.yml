        - 'Wrote reference solutions in C++ and Python under strict time and memory limits, including solutions with O(n log n) complexity.'
        - 'Designed test cases and checked edge conditions to verify solution correctness and stability.'
        - 'Wrote step-by-step explanations and hints for each solution.'

- title: Projects
  type: time_table
  contents:
    - title: AlignSSL-SV — Discovering Neural Networks for Detecting Mutations in Genomic Data
      institution: Big Mathematical Workshop 2026, Great Math Track
      year: 2026
      linkitems:
        - linkname: GitHub
          link: https://github.com/aayushkrm/AlignSSL-SV
      description:
        - 'AlignSSL-SV detects deletions, or losses of DNA segments, in sequencing data using neural networks. The model converts read alignments into tensors and predicts whether a deletion is present in a genomic region.'
        - 'The stack and evaluation include multi-scale CNNs, a transformer encoder, masked alignment modeling, temperature scaling, and MC dropout; experiments use 1000 Genomes data with cross-population evaluation, label-efficiency sweeps, and hard-negative controls.'
        - 'Research code is under active development; preprint in preparation.'
    - title: Auto-ChemInstruct — Physics-Verified Chemical Dataset Generator
      institution: Manuscript in preparation
      year: 2026
      linkitems:
        - linkname: GitHub
          link: https://github.com/aayushkrm/auto-cheminstruct
      description:
        - 'Designed a four-agent autonomous pipeline: a hypothesis agent generates reactions, a verification agent uses RDKit and xTB as physical oracles, a reflection agent builds causal chain-of-thought traces, and a compilation agent creates preference pairs for DPO/RLHF.'
        - 'Failed reactions are retained. The reflection agent explains causes such as steric hindrance and high energy barriers, producing negative examples that standard datasets often lack.'
        - 'Implemented GigaChain for literature processing, embeddings for SMILES and IUPAC, and calls to PubChem and Materials Project.'
        - 'Integrated the MAP-Elites evolutionary loop from GigaEvo to optimize agent prompts through LangGraph mutations.'
        - 'Coordinated the workflow through Maestro with a virtual research team of a GI agent, analyst, and literature reviewer, keeping dataset generation in organic chemistry, cheminformatics, and materials science reproducible and auditable.'
    - title: AuthCore — Custom Authentication and RBAC System
      institution: Personal project
      year:
      linkitems:
        - linkname: GitHub
          link: https://github.com/aayushkrm/AuthCore
      description:
        - 'Developed a stateless Python authentication system using JSON Web Tokens (JWT) for session management.'
        - 'Implemented password hashing with bcrypt.'
        - 'Designed a role-based access control (RBAC) model to protect REST API endpoints.'
        - 'Created middleware to check user permissions against a PostgreSQL database.'
        - 'Automated deployment and maintenance through Shell scripts.'
